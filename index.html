<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmConnecta - Full Stack Ecosystem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f7fdee; }
        .section-bg { background-color: #ffffff; border-radius: 1.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
        .modal-overlay { background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
        .hidden { display: none; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.fb = { initializeApp, getAuth, signInAnonymously, onAuthStateChanged, getFirestore, doc, setDoc, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp };
    </script>
</head>
<body class="text-gray-800">

    <!-- Navbar -->
    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-green-100">
        <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="bg-green-800 p-2 rounded-lg text-white">🚜</div>
                <span class="text-xl font-bold text-green-900">FarmConnecta</span>
            </div>
            <div class="flex items-center space-x-4">
                <button onclick="toggleModal('list-modal')" class="bg-green-700 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-lg hover:bg-green-800 transition">
                    + List Produce
                </button>
                <div id="user-badge" class="text-xs font-mono bg-gray-100 px-2 py-1 rounded border">Connecting...</div>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 py-8 space-y-16">
        
        <!-- Marketplace Section -->
        <section>
            <div class="flex justify-between items-end mb-8">
                <div>
                    <h2 class="text-3xl font-black text-green-900">Live Marketplace</h2>
                    <p class="text-gray-500">Real-time listings from verified farmers.</p>
                </div>
            </div>
            
            <div id="marketplace-grid" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-6">
                <!-- Real-time data injected here -->
                <div id="loading-state" class="col-span-full text-center py-12 text-gray-400">
                    <div class="animate-pulse flex flex-col items-center">
                        <div class="h-12 w-12 bg-gray-200 rounded-full mb-4"></div>
                        <p>Connecting to FarmConnecta Network...</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Input Store -->
        <section id="inputs" class="space-y-8">
            <h2 class="text-3xl font-black text-green-900">Verified Input Store</h2>
            <div class="grid md:grid-cols-3 gap-6">
                <div class="section-bg p-6 border-t-4 border-blue-500">
                    <span class="text-3xl">💊</span>
                    <h3 class="font-bold text-xl mt-2">Vet Drugs</h3>
                    <p class="text-sm text-gray-500 mb-4">Licensed vaccines & meds.</p>
                    <button onclick="alert('Store opening soon!')" class="w-full bg-blue-50 text-blue-700 py-2 rounded-lg font-bold">Shop Now</button>
                </div>
                <div class="section-bg p-6 border-t-4 border-green-500">
                    <span class="text-3xl">🧪</span>
                    <h3 class="font-bold text-xl mt-2">Agro-Chemicals</h3>
                    <p class="text-sm text-gray-500 mb-4">Fertilizers & Pesticides.</p>
                    <button onclick="alert('Store opening soon!')" class="w-full bg-green-50 text-green-700 py-2 rounded-lg font-bold">Shop Now</button>
                </div>
                <div class="section-bg p-6 border-t-4 border-orange-500">
                    <span class="text-3xl">🚜</span>
                    <h3 class="font-bold text-xl mt-2">Equipment</h3>
                    <p class="text-sm text-gray-500 mb-4">Tractors & Tools for hire.</p>
                    <button onclick="alert('Store opening soon!')" class="w-full bg-orange-50 text-orange-700 py-2 rounded-lg font-bold">Browse Catalog</button>
                </div>
            </div>
        </section>
    </main>

    <!-- List Produce Modal -->
    <div id="list-modal" class="hidden fixed inset-0 z-[100] modal-overlay flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-3xl p-8 shadow-2xl">
            <h3 class="text-2xl font-bold mb-6">List Your Produce</h3>
            <form id="produce-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-bold mb-1">Item Name</label>
                    <input type="text" id="p-name" placeholder="e.g. Yellow Maize" class="w-full p-3 bg-gray-50 rounded-xl border border-gray-200" required>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold mb-1">Price (NGN)</label>
                        <input type="number" id="p-price" placeholder="5000" class="w-full p-3 bg-gray-50 rounded-xl border border-gray-200" required>
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-1">Quantity</label>
                        <input type="text" id="p-qty" placeholder="100kg" class="w-full p-3 bg-gray-50 rounded-xl border border-gray-200" required>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1">Location</label>
                    <input type="text" id="p-loc" placeholder="Kano, Nigeria" class="w-full p-3 bg-gray-50 rounded-xl border border-gray-200" required>
                </div>
                <div class="flex gap-3 pt-4">
                    <button type="button" onclick="toggleModal('list-modal')" class="flex-1 py-3 font-bold text-gray-500">Cancel</button>
                    <button type="submit" class="flex-1 py-3 bg-green-700 text-white rounded-xl font-bold shadow-lg">Post Listing</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        const firebaseConfig = {
            apiKey: "AIzaSyAj6IgYNndFQqEZVUplg99gLZnNiJJ9I_Y",
            authDomain: "farmconnecta-6c1f0.firebaseapp.com",
            projectId: "farmconnecta-6c1f0",
            storageBucket: "farmconnecta-6c1f0.firebasestorage.app",
            messagingSenderId: "211167581489",
            appId: "1:211167581489:web:b0a264e0500a21c16d0c10",
            measurementId: "G-CFGJ35YLE6"
        };

        const { fb } = window;
        const appId = 'farmconnecta-v1';
        let db, auth, user;

        window.toggleModal = (id) => document.getElementById(id).classList.toggle('hidden');

        async function init() {
            if (!firebaseConfig.apiKey || firebaseConfig.apiKey === "") {
                renderMocks();
                return;
            }

            try {
                const app = fb.initializeApp(firebaseConfig);
                db = fb.getFirestore(app);
                auth = fb.getAuth(app);

                fb.onAuthStateChanged(auth, (u) => {
                    user = u;
                    if (u) {
                        document.getElementById('user-badge').textContent = `ID: ${u.uid.substring(0,6)}...`;
                        listenToMarketplace();
                    } else {
                        fb.signInAnonymously(auth).catch(err => {
                            console.error("Auth Error:", err);
                            renderMocks("Auth failed. Check Firebase console.");
                        });
                    }
                });
            } catch (err) {
                console.error("Firebase Init Error:", err);
                renderMocks("Connection Error. Check your Config keys.");
            }
        }

        function listenToMarketplace() {
            const path = `artifacts/${appId}/public/data/listings`;
            const q = fb.query(fb.collection(db, path));

            fb.onSnapshot(q, (snapshot) => {
                const container = document.getElementById('marketplace-grid');
                if (snapshot.empty) {
                    container.innerHTML = `<div class="col-span-full text-center py-10 bg-white rounded-2xl border-2 border-dashed border-gray-100 text-gray-400">No live listings yet. Be the first to post!</div>`;
                    return;
                }

                container.innerHTML = snapshot.docs.map(doc => {
                    const data = doc.data();
                    return `
                        <div class="section-bg p-6 hover:shadow-xl transition group border border-transparent hover:border-green-100">
                            <div class="h-32 bg-green-50 rounded-xl mb-4 flex items-center justify-center text-4xl group-hover:scale-105 transition">📦</div>
                            <h3 class="font-bold text-green-900">${data.name}</h3>
                            <p class="text-green-600 font-black mt-1">${Number(data.price).toLocaleString()} NGN <span class="text-xs text-gray-400">/${data.qty}</span></p>
                            <div class="flex items-center text-[10px] uppercase tracking-wider text-gray-400 font-bold mt-3">
                                <span class="mr-2">📍 ${data.location}</span>
                            </div>
                            <button class="w-full mt-4 py-2 bg-green-100 text-green-800 rounded-lg text-sm font-bold hover:bg-green-700 hover:text-white transition">Buy Now</button>
                        </div>
                    `;
                }).join('');
            }, (err) => {
                console.error("Firestore Error:", err);
                if (err.code === 'permission-denied') {
                    renderMocks("Permission Denied. Did you publish your Firestore Rules?");
                }
            });
        }

        document.getElementById('produce-form').onsubmit = async (e) => {
            e.preventDefault();
            if (!user) return alert("Please wait for secure connection...");

            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.textContent = "Posting...";

            try {
                const path = `artifacts/${appId}/public/data/listings`;
                await fb.addDoc(fb.collection(db, path), {
                    name: document.getElementById('p-name').value,
                    price: document.getElementById('p-price').value,
                    qty: document.getElementById('p-qty').value,
                    location: document.getElementById('p-loc').value,
                    userId: user.uid,
                    createdAt: fb.serverTimestamp()
                });
                
                e.target.reset();
                toggleModal('list-modal');
            } catch (err) {
                alert("Error posting listing. Check your Firestore Rules.");
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.textContent = "Post Listing";
            }
        };

        function renderMocks(reason = "Firebase Config Missing") {
            document.getElementById('user-badge').textContent = "Demo Mode";
            document.getElementById('marketplace-grid').innerHTML = `
                <div class="col-span-full p-6 bg-amber-50 text-amber-800 rounded-xl text-sm mb-4 border border-amber-200">
                    <div class="flex items-center">
                        <span class="text-xl mr-3">⚠️</span>
                        <div>
                            <p class="font-bold">App is in Demo Mode</p>
                            <p class="opacity-80">${reason}. To go live, add your keys to the code.</p>
                        </div>
                    </div>
                </div>
                ${[1,2,3,4].map(() => `
                    <div class="section-bg p-6 opacity-60 grayscale">
                        <div class="h-32 bg-gray-100 rounded-xl mb-4"></div>
                        <div class="h-4 bg-gray-200 w-3/4 mb-2"></div>
                        <div class="h-4 bg-gray-200 w-1/2"></div>
                    </div>
                `).join('')}
            `;
        }

        window.onload = init;
    </script>
</body>
</html>
